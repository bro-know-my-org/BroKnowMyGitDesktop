<!doctype html><html><head><meta charset="utf-8"></head><body><script type="module">
import { createApp, h } from 'vue';
import MediaPreview from '/src/features/repository/components/MediaResourcePreview.vue';
import PdfPreview from '/src/features/repository/components/PdfResourcePreview.vue';
const invoke = window.__TAURI_INTERNALS__.invoke;
const results=[];
try {
  for(const path of ['test.png','test.svg','test.wav','test.pdf']) {
    const preview=await invoke('get_resource_preview',{repositoryPath:window.resourceTestRepository,comparison:{path,staged:false}});
    const file=preview.sides[1].file;
    const url=window.__TAURI_INTERNALS__.convertFileSrc(file,'asset');
    const response=await fetch(url);
    if(!response.ok)throw new Error(`${path} HTTP ${response.status}`);
    if(path.endsWith('.wav') || path.endsWith('.pdf')) {
      const host=document.createElement('div');document.body.append(host);
      const pdf=path.endsWith('.pdf');
      const app=createApp({render:()=>h(pdf?PdfPreview:MediaPreview,pdf?{url}:{url,kind:'audio'})});app.mount(host);
      let ready=false;
      for(let i=0;i<200;i++) {
        const canvas=host.querySelector('canvas'),audio=host.querySelector('audio');
        ready=pdf ? canvas?.width>300 && canvas.getContext('2d').getImageData(10,10,1,1).data[0]===255 : audio?.duration===1;
        if(ready)break;
        await new Promise(resolve=>setTimeout(resolve,50));
      }
      if(!ready)throw new Error(path+' component did not decode: '+host.textContent);
      results.push({path,status:response.status,componentDecoded:true});
      app.unmount();host.remove();await invoke('release_resource_preview',{id:preview.id});continue;
    }
    const img=new Image();img.crossOrigin='anonymous';img.src=url;await img.decode();
    const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
    const context=canvas.getContext('2d');context.drawImage(img,0,0);context.getImageData(0,0,1,1);
    results.push({path,status:response.status,width:img.naturalWidth,height:img.naturalHeight,pixelsReadable:true});
    await invoke('release_resource_preview',{id:preview.id});
  }
  await invoke('report_native_resource',{result:JSON.stringify(results)});
} catch(error) {
  await invoke('report_native_resource',{result:'FAILED '+JSON.stringify(results)+' '+String(error)});
}
</script></body></html>
