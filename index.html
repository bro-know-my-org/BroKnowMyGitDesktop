<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>BroKnowMyGitDesktop</title>
    <style>
      :root {
        --bkm-startup-bg: #f6f8fb;
        --bkm-startup-text: #1d2635;
        --bkm-startup-muted: #8994a6;

        color-scheme: light;
        background: var(--bkm-startup-bg);
      }

      body {
        margin: 0;
        background: var(--bkm-startup-bg);
      }

      #bkm-startup {
        display: grid;
        width: 100vw;
        height: 100vh;
        place-items: center;
        overflow: hidden;
        background: var(--bkm-startup-bg);
        color: var(--bkm-startup-text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .bkm-startup-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transform: translateY(-12px);
      }

      .bkm-startup-logo {
        display: block;
        width: 72px;
        height: 72px;
      }

      .bkm-startup-title {
        margin: 2px 0 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }

      .bkm-startup-status {
        margin: -6px 0 0;
        color: var(--bkm-startup-muted);
        font-size: 12px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bkm-startup-bg: #1c1c1e;
          --bkm-startup-text: rgba(255, 255, 255, 0.95);
          --bkm-startup-muted: rgba(255, 255, 255, 0.55);

          color-scheme: dark;
        }
      }

      :root[data-startup-theme="light"] {
        --bkm-startup-bg: #f6f8fb;
        --bkm-startup-text: #1d2635;
        --bkm-startup-muted: #8994a6;

        color-scheme: light;
      }

      :root[data-startup-theme="dark"] {
        --bkm-startup-bg: #1c1c1e;
        --bkm-startup-text: rgba(255, 255, 255, 0.95);
        --bkm-startup-muted: rgba(255, 255, 255, 0.55);

        color-scheme: dark;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div id="bkm-startup" role="status" aria-label="Starting BroKnowMyGitDesktop">
        <main class="bkm-startup-content">
          <img class="bkm-startup-logo" src="./src-tauri/icons/icon.png" alt="" aria-hidden="true" />
          <p class="bkm-startup-title">BroKnowMyGitDesktop</p>
          <p class="bkm-startup-status" data-startup-status>Starting...</p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
